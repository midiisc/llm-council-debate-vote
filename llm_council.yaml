# WORKAROUND for a confirmed bug in llm-council-core==0.40.1's load_config()
# (unified_config.py ~line 1095): it extracts the *inner* contents of the
# top-level "council:" key and passes them directly as UnifiedConfig(**...)
# kwargs, instead of re-nesting under `.council`. UnifiedConfig has no
# top-level `models`/`chairman`/etc. fields, so anything placed at the normal
# nesting level silently falls back to the package's hardcoded defaults
# (including deepseek/deepseek-v4-pro, never requested here) with NO error.
# Verified 2026-08-09 by direct execution against load_config() - see
# docs/upstream-deltas.md. Fix: wrap council-level fields in one EXTRA
# "council:" layer so they land correctly after the buggy unwrap. `gateways:`
# and `tiers:` do NOT need the extra wrapper - they're real top-level
# UnifiedConfig fields and get hoisted correctly as-is (that's what made this
# bug easy to miss).
#
# SECOND bug, also confirmed by direct execution: council_health_check reads
# the flat council.models list (correct above), but a real consult_council()
# call resolves its model list via TierContract.allowed_models instead - see
# council.py's run_council_with_fallback: "explicit models arg > tier_contract
# > default". Since consult_council always passes a tier_contract, the flat
# council.models list is NEVER consulted for an actual query. TierContract's
# allowed_models comes from tiers.pools.<confidence>.models, which pydantic's
# TierConfig.ensure_default_pools() auto-fills with the SAME wrong package
# defaults if left unset here - silently, no error. Every tier actually used
# by this project's confidence levels must be populated explicitly below.
council:
  council:
    models:
      - anthropic/claude-opus-4.8
      - openai/gpt-5.5
      - google/gemini-3.6-flash
      - z-ai/glm-5.2  # 2026-08-12: was z-ai/glm-5.2-20260616 - that dated slug
                        # is DEAD on live OpenRouter (confirmed via direct
                        # /api/v1/models fetch, only z-ai/glm-5.2 and
                        # z-ai/glm-5.2:batch exist now). See upstream-deltas.md.
    chairman: anthropic/claude-opus-4.8
    chairman_disabled: false
    synthesis_mode: debate
    exclude_self_votes: true
    style_normalization: true
  gateways:
    default: openrouter
    fallback:
      enabled: true
      chain: [openrouter]  # only openrouter key exists (2026-08-09) - pinned
                            # explicitly so a failure surfaces clearly instead
                            # of silently falling through to requesty/direct,
                            # which would error anyway with no stored keys.
  tiers:
    # 2026-08-12: was "high" (deadline_ms=180000, per_model=90000, token_budget=4096,
    # max_attempts=3). Confirmed by direct execution of load_config()+get_tier_contract()
    # against llm-council-core==0.40.1 that "high" and "reasoning" resolve the SAME 4
    # models (allowed_models identical) - "reasoning" just has a bigger budget:
    # deadline_ms=600000, per_model=300000, token_budget=8192 (2x), max_attempts=2 (-1).
    # Switched to give the same frontier models more time/tokens to actually finish a
    # deep debate instead of racing a 180s/4096-token ceiling. See docs/upstream-deltas.md.
    default: reasoning
    pools:
      high:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.6-flash
          - z-ai/glm-5.2
      quick:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
      balanced:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.6-flash
      reasoning:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.6-flash
          - z-ai/glm-5.2
  evaluation:
    rubric:
      enabled: true  # 5-dimension scoring (accuracy/relevance/completeness/
                      # conciseness/clarity) - was off by default, never set
                      # before the 2026-08-09 dry run; accuracy_ceiling_enabled
                      # already defaults to true, no change needed there.
    safety:
      enabled: true  # 2026-08-12: was off by default. check_response_safety
                      # (safety_gate.py) confirmed by direct source read to be
                      # a pure local regex scan (SAFETY_PATTERNS) - no external
                      # classifier call, no new egress, zero marginal cost.
                      # This pipeline ingests untrusted third-party documents;
                      # a free local scan on Stage-1 responses is reasonable
                      # defense-in-depth. See upstream-deltas.md, Second Expert
                      # Panel round.

# CUSTOM section, added 2026-08-12 - deliberately a TRUE top-level key,
# a SIBLING of the outer "council:" wrapper above, never nested inside it.
# load_config() does exactly UnifiedConfig(**raw_config.get("council", {})),
# so this key is invisible to it by construction - never read via
# get_config()/UnifiedConfig, only via scripts/resilient_query.py's own
# yaml.safe_load(). This is the opposite placement rule from every other
# block in this file (which all exist to get package-native keys INTO the
# one place load_config() reads) - see docs/upstream-deltas.md, "Debate
# resilience" entry, for why deliberately keeping this package-invisible is
# correct here (no UnifiedConfig field exists for it; nesting it under
# council: would either be silently dropped or, worse, collide with a real
# field by accident).
#
# Supersedes the prior "do not reflexively backfill a dropped 4th model"
# decision (pipeline-architecture-spec.md §2) - user-approved 2026-08-12,
# see that file's "Superseding decision" section. Backup candidates
# live-confirmed on OpenRouter + web-researched for debate/critique fit,
# all from labs distinct from the 4 configured council.models above
# (Anthropic/OpenAI/Google/Zhipu) - see upstream-deltas.md for sourcing.
#
# Ordering below (2026-08-12) is the ranked output of a grounded 3-lens
# judge panel run specifically to answer "which candidate maximizes
# training-corpus/methodology diversity against the existing 4 seats" -
# see upstream-deltas.md, "4th-seat diversity panel" entry, and
# pipeline-architecture-spec.md §2 for the full reasoning. The panel's
# diversity-optimized top pick was Kimi K3, not GLM-5.2's incumbent seat -
# user explicitly chose to KEEP GLM-5.2 as the primary seat (lower risk,
# already-verified debate/critique quality) and use the panel's own
# backup ranking instead of its primary-seat recommendation. First-unused
# entry wins a slot (see docs/specs/debate-resilience-contract.md) - order
# here is deliberate, not incidental.
debate_resilience:
  backup_models:
    - moonshotai/kimi-k3-20260715  # Moonshot AI - panel's diversity-optimized
                                     # top pick (self-critique-reward alignment,
                                     # not RLHF - most methodologically distinct
                                     # of all 4 candidates). DATED SLUG - same
                                     # risk class as the z-ai/glm-5.2-20260616
                                     # slug that went dead 2026-08-12; re-verify
                                     # against live OpenRouter before this is
                                     # ever promoted out of the backup pool.
    - qwen/qwen3.8-max               # Alibaba - live-confirmed 2026-08-12, 1M
                                       # context. Methodologically redundant
                                       # with GLM (both RLVR-primary + late
                                       # human-preference stage) - ranked 2nd
                                       # backup, not 1st, for that reason.
    - x-ai/grok-4.6                   # xAI - live-confirmed 2026-08-12, 500K
                                        # context. Ranked LAST on the diversity
                                        # axis this pool exists for - its own
                                        # model cards describe an RLHF/RLAIF
                                        # pipeline built on Anthropic's own
                                        # Petri audit tooling, structurally the
                                        # same paradigm as the 3 incumbent
                                        # seats. Kept as pure-resilience
                                        # fallback, not a diversity pick.
  minimum_council_size: 4  # below this, proceed degraded but never silently -
                             # scripts/resilient_query.py's shortfall_warning
                             # must be surfaced in the run's output.
  retry:
    max_attempts: 3         # includes the first try
    backoff_seconds: [5, 15]  # wait before retry 2, retry 3
    # Any status the package's query_model_with_status returns that is NOT
    # in this list (currently only "auth_error") is treated as terminal -
    # retrying an identical request against a bad/inaccessible key can't
    # succeed. See upstream-deltas.md's STATUS_* taxonomy table.
    retryable_statuses: [timeout, rate_limited, error]
