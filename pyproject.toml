[project]
name = "llm-council-debate-vote"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "llm-council-core[mcp,secure]>=0.39.0",
]

[project.scripts]
scorecard = "scripts.scorecard:main"
llm-council-pipeline = "scripts.pipeline_runner:main"

[dependency-groups]
dev = [
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pyright]
venvPath = "."
venv = ".venv"
