# WORKAROUND for a confirmed bug in llm-council-core==0.40.1's load_config()
# (unified_config.py ~line 1095): it extracts the *inner* contents of the
# top-level "council:" key and passes them directly as UnifiedConfig(**...)
# kwargs, instead of re-nesting under `.council`. UnifiedConfig has no
# top-level `models`/`chairman`/etc. fields, so anything placed at the normal
# nesting level silently falls back to the package's hardcoded defaults
# (including deepseek/deepseek-v4-pro, never requested here) with NO error.
# Verified 2026-08-09 by direct execution against load_config() - see
# docs/upstream-deltas.md. Fix: wrap council-level fields in one EXTRA
# "council:" layer so they land correctly after the buggy unwrap. `gateways:`
# and `tiers:` do NOT need the extra wrapper - they're real top-level
# UnifiedConfig fields and get hoisted correctly as-is (that's what made this
# bug easy to miss).
#
# SECOND bug, also confirmed by direct execution: council_health_check reads
# the flat council.models list (correct above), but a real consult_council()
# call resolves its model list via TierContract.allowed_models instead - see
# council.py's run_council_with_fallback: "explicit models arg > tier_contract
# > default". Since consult_council always passes a tier_contract, the flat
# council.models list is NEVER consulted for an actual query. TierContract's
# allowed_models comes from tiers.pools.<confidence>.models, which pydantic's
# TierConfig.ensure_default_pools() auto-fills with the SAME wrong package
# defaults if left unset here - silently, no error. Every tier actually used
# by this project's confidence levels must be populated explicitly below.
council:
  council:
    models:
      - anthropic/claude-opus-4.8
      - openai/gpt-5.5
      - google/gemini-3.6-flash
      - z-ai/glm-5.2  # 2026-08-12: was z-ai/glm-5.2-20260616 - that dated slug
                        # is DEAD on live OpenRouter (confirmed via direct
                        # /api/v1/models fetch, only z-ai/glm-5.2 and
                        # z-ai/glm-5.2:batch exist now). See upstream-deltas.md.
    chairman: anthropic/claude-opus-4.8
    chairman_disabled: false
    synthesis_mode: debate
    exclude_self_votes: true
    style_normalization: true
  gateways:
    default: openrouter
    fallback:
      enabled: true
      chain: [openrouter]  # only openrouter key exists (2026-08-09) - pinned
                            # explicitly so a failure surfaces clearly instead
                            # of silently falling through to requesty/direct,
                            # which would error anyway with no stored keys.
  tiers:
    # 2026-08-12: was "high" (deadline_ms=180000, per_model=90000, token_budget=4096,
    # max_attempts=3). Confirmed by direct execution of load_config()+get_tier_contract()
    # against llm-council-core==0.40.1 that "high" and "reasoning" resolve the SAME 4
    # models (allowed_models identical) - "reasoning" just has a bigger budget:
    # deadline_ms=600000, per_model=300000, token_budget=8192 (2x), max_attempts=2 (-1).
    # Switched to give the same frontier models more time/tokens to actually finish a
    # deep debate instead of racing a 180s/4096-token ceiling. See docs/upstream-deltas.md.
    default: reasoning
    pools:
      high:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.6-flash
          - z-ai/glm-5.2
      quick:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
      balanced:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.6-flash
      reasoning:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.6-flash
          - z-ai/glm-5.2
  evaluation:
    rubric:
      enabled: true  # 5-dimension scoring (accuracy/relevance/completeness/
                      # conciseness/clarity) - was off by default, never set
                      # before the 2026-08-09 dry run; accuracy_ceiling_enabled
                      # already defaults to true, no change needed there.
    safety:
      enabled: true  # 2026-08-12: was off by default. check_response_safety
                      # (safety_gate.py) confirmed by direct source read to be
                      # a pure local regex scan (SAFETY_PATTERNS) - no external
                      # classifier call, no new egress, zero marginal cost.
                      # This pipeline ingests untrusted third-party documents;
                      # a free local scan on Stage-1 responses is reasonable
                      # defense-in-depth. See upstream-deltas.md, Second Expert
                      # Panel round.
