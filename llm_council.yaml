# WORKAROUND for a confirmed bug in llm-council-core==0.40.1's load_config()
# (unified_config.py ~line 1095): it extracts the *inner* contents of the
# top-level "council:" key and passes them directly as UnifiedConfig(**...)
# kwargs, instead of re-nesting under `.council`. UnifiedConfig has no
# top-level `models`/`chairman`/etc. fields, so anything placed at the normal
# nesting level silently falls back to the package's hardcoded defaults
# (including deepseek/deepseek-v4-pro, never requested here) with NO error.
# Verified 2026-08-09 by direct execution against load_config() - see
# docs/upstream-deltas.md. Fix: wrap council-level fields in one EXTRA
# "council:" layer so they land correctly after the buggy unwrap. `gateways:`
# and `tiers:` do NOT need the extra wrapper - they're real top-level
# UnifiedConfig fields and get hoisted correctly as-is (that's what made this
# bug easy to miss).
#
# SECOND bug, also confirmed by direct execution: council_health_check reads
# the flat council.models list (correct above), but a real consult_council()
# call resolves its model list via TierContract.allowed_models instead - see
# council.py's run_council_with_fallback: "explicit models arg > tier_contract
# > default". Since consult_council always passes a tier_contract, the flat
# council.models list is NEVER consulted for an actual query. TierContract's
# allowed_models comes from tiers.pools.<confidence>.models, which pydantic's
# TierConfig.ensure_default_pools() auto-fills with the SAME wrong package
# defaults if left unset here - silently, no error. Every tier actually used
# by this project's confidence levels must be populated explicitly below.
council:
  council:
    models:
      - anthropic/claude-opus-4.8
      - openai/gpt-5.5
      - google/gemini-3.7-flash  # 2026-08-16: was google/gemini-3.6-flash.
                                   # Live OpenRouter /api/v1/models fetch
                                   # confirmed 3.7-flash has IDENTICAL specs
                                   # to 3.6-flash (1,048,576 context, 65,536
                                   # max output, same supported_parameters
                                   # list incl. reasoning_effort) at exactly
                                   # HALF the price ($0.375/$1.875 per M
                                   # prompt/completion vs $0.75/$3.75). The
                                   # 2026-08-13/14 decision to keep 3.6-flash
                                   # (see comment below on normalizer_model,
                                   # and upstream-deltas.md) cited only "zero
                                   # operational track record" against
                                   # 3.7-flash, not a technical gap - user
                                   # explicitly approved the swap once the
                                   # pricing was confirmed live. Real-money
                                   # gate (Pillar 6): a fresh dry-run Cost &
                                   # Tokens summary is required before the
                                   # next real-decision use. See
                                   # upstream-deltas.md.
      - moonshotai/kimi-k3  # 2026-08-17: was z-ai/glm-5.2 - SWAPPED, not added
                              # (council stays at 4 seats; a unanimous
                              # 2026-08-13 4-judge panel rejected any 5th seat,
                              # see agent-model-reasoning-config.md §1). GLM-5.2
                              # was never graduated (3 logged sessions total,
                              # scorecard.jsonl, nowhere near the 20-session
                              # ADR-029 bar) - swapped for the panel's own
                              # diversity-optimized pick (2026-08-12 finding:
                              # Kimi K3 is the only backup-pool candidate with a
                              # genuinely different post-training methodology -
                              # self-critique rubric-reward, no RLHF - vs. this
                              # roster's other 3 RLHF-based seats; Qwen3.8-Max
                              # and Grok-4.6 were both rejected for this specific
                              # swap as diversity-redundant or diversity-negative
                              # respectively). Blocking precondition (Kimi K3 was
                              # upstream capacity-constrained at Moonshot,
                              # confirmed live 2026-08-17) cleared same day by a
                              # real, cheap, user-confirmed API test call
                              # (status=ok, latency_ms=5612, cost=$0.001) - one
                              # low-load sample, not a load test; this dry run is
                              # the real signal on 4-model concurrent behavior.
                              # Full reasoning: docs/specs/core-seat-swap-
                              # contract.md, docs/upstream-deltas.md.
    chairman: anthropic/claude-opus-4.8
    chairman_disabled: false
    synthesis_mode: debate
    exclude_self_votes: true
    style_normalization: true
    # Pinned 2026-08-14 (was left unset, inheriting the package's own
    # hardcoded default). Two independent reasons, both grounded live this
    # session:
    # 1. REAL BREAKAGE, not just a quality question - the inherited default
    #    (`google/gemini-3.1-flash-lite-preview`) is DEAD on live OpenRouter
    #    (confirmed via direct /api/v1/models fetch, 2026-08-14) - leaving
    #    this unset would fail Stage 1.5/the Stage 2 commentary-
    #    normalization extension (docs/upstream-deltas.md, "Known residual
    #    limitation" correction entry) the next time either actually runs.
    # 2. Rewriter-model choice measurably affects anonymization quality:
    #    "Voice Under Revision" (Tom van Nuenen, arXiv:2604.22142v1, April
    #    2026) measured residual re-identification accuracy after a single
    #    style-rewrite pass across 300 personal narratives, nearest-
    #    neighbor stylometric matching - GPT-5.4: 14.3% matched (worst),
    #    Claude Sonnet 4.6: 1.7%, Gemini 3.1 Pro: 1.0% (best, vs. a 0.3%
    #    chance baseline). Neither the exact Gemini 3.1 Pro tier tested
    #    (no Gemini Pro-tier text model exists on OpenRouter at all,
    #    confirmed live 2026-08-14, matching the same gap already recorded
    #    in pipeline-architecture-spec.md Gap 1) nor Claude Sonnet 4.6
    #    (superseded; live catalog only has anthropic/claude-sonnet-5, a
    #    different, untested generation) is available today - this is a
    #    reasoned choice under real uncertainty, not a re-run of the paper.
    #    google/gemini-3.6-flash chosen over google/gemini-3.7-flash
    #    (newer, cheaper, but zero operational track record in this
    #    project) and google/gemini-3.5-flash-lite (cheapest, but a lower
    #    capability tier on a task where preserving content while
    #    genuinely rewriting style matters) because it's the SAME model
    #    already trusted as this pipeline's own 3rd core council seat -
    #    same vendor/family as the paper's single best-evidenced
    #    performer, plus an already-proven, live-verified integration
    #    rather than a new untested dependency (Resource & Stability
    #    Gate's stability-over-novelty preference). Not claimed to
    #    replicate the paper's exact 1.0% figure - that number is Pro-tier
    #    specific and this pipeline's task (analytical/technical debate
    #    responses, not personal narratives) was never tested by that
    #    paper. Real-money gate (Pillar 6): this changes Stage 1.5's/the
    #    new Stage 2 normalization's actual runtime behavior for the first
    #    time (previously silently broken) - a fresh dry run showing the
    #    Cost & Tokens summary is required before the next real-decision
    #    use, not yet performed this session. See docs/upstream-deltas.md.
    #    SUPERSEDED 2026-08-16: swapped to google/gemini-3.7-flash to match
    #    the core council seat above (same "SAME model as core seat"
    #    rationale that justified 3.6-flash here in the first place still
    #    applies). See upstream-deltas.md.
    normalizer_model: google/gemini-3.7-flash
  gateways:
    default: openrouter
    fallback:
      enabled: true
      chain: [openrouter]  # only openrouter key exists (2026-08-09) - pinned
                            # explicitly so a failure surfaces clearly instead
                            # of silently falling through to requesty/direct,
                            # which would error anyway with no stored keys.
  tiers:
    # 2026-08-12: was "high" (deadline_ms=180000, per_model=90000, token_budget=4096,
    # max_attempts=3). Confirmed by direct execution of load_config()+get_tier_contract()
    # against llm-council-core==0.40.1 that "high" and "reasoning" resolve the SAME 4
    # models (allowed_models identical) - "reasoning" just has a bigger budget:
    # deadline_ms=600000, per_model=300000, token_budget=8192 (2x), max_attempts=2 (-1).
    # Switched to give the same frontier models more time/tokens to actually finish a
    # deep debate instead of racing a 180s/4096-token ceiling. See docs/upstream-deltas.md.
    default: reasoning
    pools:
      high:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.7-flash
          - moonshotai/kimi-k3
      quick:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
      balanced:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.7-flash
      reasoning:
        models:
          - anthropic/claude-opus-4.8
          - openai/gpt-5.5
          - google/gemini-3.7-flash
          - moonshotai/kimi-k3
  evaluation:
    rubric:
      enabled: true  # 5-dimension scoring (accuracy/relevance/completeness/
                      # conciseness/clarity) - was off by default, never set
                      # before the 2026-08-09 dry run; accuracy_ceiling_enabled
                      # already defaults to true, no change needed there.
    safety:
      enabled: true  # 2026-08-12: was off by default. check_response_safety
                      # (safety_gate.py) confirmed by direct source read to be
                      # a pure local regex scan (SAFETY_PATTERNS) - no external
                      # classifier call, no new egress, zero marginal cost.
                      # This pipeline ingests untrusted third-party documents;
                      # a free local scan on Stage-1 responses is reasonable
                      # defense-in-depth. See upstream-deltas.md, Second Expert
                      # Panel round.

# CUSTOM section, added 2026-08-12 - deliberately a TRUE top-level key,
# a SIBLING of the outer "council:" wrapper above, never nested inside it.
# load_config() does exactly UnifiedConfig(**raw_config.get("council", {})),
# so this key is invisible to it by construction - never read via
# get_config()/UnifiedConfig, only via scripts/resilient_query.py's own
# yaml.safe_load(). This is the opposite placement rule from every other
# block in this file (which all exist to get package-native keys INTO the
# one place load_config() reads) - see docs/upstream-deltas.md, "Debate
# resilience" entry, for why deliberately keeping this package-invisible is
# correct here (no UnifiedConfig field exists for it; nesting it under
# council: would either be silently dropped or, worse, collide with a real
# field by accident).
#
# Supersedes the prior "do not reflexively backfill a dropped 4th model"
# decision (pipeline-architecture-spec.md §2) - user-approved 2026-08-12,
# see that file's "Superseding decision" section. Backup candidates
# live-confirmed on OpenRouter + web-researched for debate/critique fit,
# all from labs distinct from the 4 configured council.models above
# (Anthropic/OpenAI/Google/Zhipu) - see upstream-deltas.md for sourcing.
#
# Ordering below (originally 2026-08-12, RE-RANKED 2026-08-17) is the
# ranked output of a grounded 3-lens judge panel run specifically to answer
# "which candidate maximizes training-corpus/methodology diversity against
# the existing 4 seats" - see upstream-deltas.md, "4th-seat diversity
# panel" entry, and pipeline-architecture-spec.md §2 for the full
# reasoning. The panel's diversity-optimized top pick was Kimi K3, not
# GLM-5.2's then-incumbent seat - user originally chose to KEEP GLM-5.2 as
# the primary seat (lower risk, already-verified debate/critique quality)
# and use the panel's own backup ranking instead of its primary-seat
# recommendation. SUPERSEDED 2026-08-17: GLM-5.2 never graduated its
# 20-session ADR-029 bar (3 logged sessions total) - swapped out for
# Kimi K3 per docs/specs/core-seat-swap-contract.md. Kimi K3 removed from
# this backup list (now a core seat, no longer eligible to backstop
# itself); Qwen3.8-Max and Grok-4.6 keep their relative order, renumbered.
# First-unused entry wins a slot (see docs/specs/debate-resilience-
# contract.md) - order here is deliberate, not incidental.
debate_resilience:
  backup_models:
    - qwen/qwen3.8-max                # Alibaba - live-confirmed 2026-08-12, 1M
                                        # context. Rank 1 as of 2026-08-17 (was
                                        # rank 2) after Kimi K3 promoted to a
                                        # core seat. Methodologically redundant
                                        # with GLM-5.2's former role (both
                                        # RLVR-primary + late human-preference
                                        # stage) - a resilience pick, not a
                                        # diversity one.
    - x-ai/grok-4.6                    # xAI - live-confirmed 2026-08-12, 500K
                                        # context. Rank 2 as of 2026-08-17 (was
                                        # rank 3). Ranked LAST on the diversity
                                        # axis this pool exists for - its own
                                        # model cards describe an RLHF/RLAIF
                                        # pipeline built on Anthropic's own
                                        # Petri audit tooling, structurally the
                                        # same paradigm as the other core
                                        # seats. Kept as pure-resilience
                                        # fallback, not a diversity pick.
  minimum_council_size: 4  # below this, proceed degraded but never silently -
                             # scripts/resilient_query.py's shortfall_warning
                             # must be surfaced in the run's output.
  retry:
    max_attempts: 3         # includes the first try
    backoff_seconds: [5, 15]  # wait before retry 2, retry 3
    # Any status the package's query_model_with_status returns that is NOT
    # in this list (currently only "auth_error") is treated as terminal -
    # retrying an identical request against a bad/inaccessible key can't
    # succeed. See upstream-deltas.md's STATUS_* taxonomy table.
    retryable_statuses: [timeout, rate_limited, error]
